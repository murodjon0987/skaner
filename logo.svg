<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b" />
      <stop offset="50%" stop-color="#0f111e" />
      <stop offset="100%" stop-color="#091424" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Barcode Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Scanner Reticle Corners (Target Box) -->
  <path d="M 24 40 L 24 26 Q 24 24 26 24 L 40 24" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 104 40 L 104 26 Q 104 24 102 24 L 88 24" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 24 88 L 24 102 Q 24 104 26 104 L 40 104" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 104 88 L 104 102 Q 104 104 102 104 L 88 104" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />

  <!-- Barcode Vertical Bars -->
  <g fill="url(#barGrad)">
    <rect x="34" y="34" width="6" height="60" rx="3" />
    <rect x="44" y="34" width="3" height="60" rx="1.5" />
    <rect x="51" y="34" width="8" height="60" rx="4" />
    <rect x="63" y="34" width="4" height="60" rx="2" />
    <rect x="71" y="34" width="7" height="60" rx="3.5" />
    <rect x="82" y="34" width="3" height="60" rx="1.5" />
    <rect x="89" y="34" width="5" height="60" rx="2.5" />
  </g>

  <!-- Glowing Laser Scan Line -->
  <g filter="url(#glow)">
    <line x1="18" y1="64" x2="110" y2="64" stroke="#06b6d4" stroke-width="5" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="22" y1="64" x2="106" y2="64" stroke="url(#laserGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Laser Center Pulse Point -->
    <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Little POS lightning badge (top-right) -->
  <g transform="translate(76, 16)">
    <circle cx="28" cy="12" r="11" fill="#06b6d4" filter="url(#softGlow)" opacity="0.3" />
    <circle cx="28" cy="12" r="9" fill="#06b6d4" />
    <path d="M 28 6 L 24 13 L 28 13 L 27 18 L 32 11 L 28 11 Z" fill="#ffffff" />
  </g>
</svg>
